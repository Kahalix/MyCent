;[mypy]
;plugins = mypy_django_plugin.main, mypy_drf_plugin.main
;
;# Sensowne ostrzeżenia bez przesadnej „surowości”
;check_untyped_defs = True
;disallow_incomplete_defs = True
;disallow_untyped_defs = True
;no_implicit_optional = True
;strict_equality = True
;warn_redundant_casts = True
;warn_unused_ignores = True
;show_error_codes = True
;pretty = True
;
;# Third-party – ucisz importy bez stubów (jeśli ich używasz)
;[mypy-django_filters.*]
;ignore_missing_imports = True
;[mypy-rest_framework_simplejwt.*]
;ignore_missing_imports = True
;[mypy-djmoney.*]
;ignore_missing_imports = True
;[mypy-moneyed.*]
;ignore_missing_imports = True
;[mypy-drf_yasg.*]
;ignore_missing_imports = True
;
;# Migrations – nie sprawdzamy
;[mypy-*.migrations.*]
;ignore_errors = True
;
;# Konfiguracja pluginu django-stubs
;[mypy.plugins.django-stubs]
;django_settings_module = config.settings
;# Pomaga przy dynamicznych atrybutach modeli (np. *_id)
;ignore_missing_model_attributes = True
;strict_settings = True
