{% load static %}
<!doctype html>
<html lang="pl" class="h-full">
<head hx-ext="head-support">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="stripe-pk" content="{{ STRIPE_PUBLISHABLE_KEY }}">
  <title>{% block title %}MyCent{% endblock %}</title>

  <!-- STRIPE (global) -->

    <script>
      window.STRIPE_PK = "{{ STRIPE_PUBLISHABLE_KEY }}";
    </script>

  <script src="https://js.stripe.com/v3" async></script>

  <!-- Motyw asap -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme')
          || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'lownDark' : 'lownLight');
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.classList.toggle('dark', t === 'lownDark');
      } catch (e) {}
    })();
  </script>

  <link rel="stylesheet" href="{% static 'css/tailwind.css' %}">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <link rel="icon" href="{% static 'img/favicon.png' %}" />
  <style>[x-cloak]{display:none !important}</style>


  <!-- HTMX -->
  <script defer src="https://unpkg.com/htmx.org@1.9.12/dist/htmx.min.js"></script>
  <script defer src="https://unpkg.com/htmx.org@1.9.12/dist/ext/head-support.js"></script>

  <!-- Nasze moduły -->

  <script defer src="{% static 'js/utils/attrs-pl.js' %}"></script>
  <script defer src="{% static 'js/core/ci_picker_stub.js' %}"></script>
  <script defer src="{% static 'js/core/ws_hub.js' %}"></script>
  <script defer src="{% static 'js/core/utils.js' %}"></script>
  <script defer src="{% static 'js/core/bridge.js' %}"></script>
  <script defer src="{% static 'js/core/toast.js' %}"></script>
  <script defer src="{% static 'js/core/theme.js' %}"></script>
  <script defer src="{% static 'js/core/nav.js' %}"></script>
  <script defer src="{% static 'js/core/guard.js' %}"></script>
  <script defer src="{% static 'js/identity/auth.js' %}"></script>
  <script defer src="{% static 'js/identity/login.js' %}"></script>
  <script defer src="{% static 'js/identity/profile.js' %}"></script>
  <script defer src="{% static 'js/shipping/shipping.js' %}"></script>
  <script defer src="{% static 'js/identity/my_seller.js' %}"></script>
  <script defer src="{% static 'js/shared/catalog_common.js' %}"></script>
  <script defer src="{% static 'js/listings/offers_list.js' %}"></script>
  <script defer src="{% static 'js/listings/offer_form.js' %}"></script>
  <script defer src="{% static 'js/listings/user_offers_list.js' %}"></script>
  <script defer src="{% static 'js/listings/user_offer_form.js' %}"></script>
  <script defer src="{% static 'js/listings/public_list.js' %}"></script>
  <script defer src="{% static 'js/listings/public_seller_shop.js' %}"></script>
  <script defer src="{% static 'js/listings/item_detail.js' %}"></script>
  <script defer src="{% static 'js/identity/user_public.js' %}"></script>
  <script defer src="{% static 'js/carts/cart_page.js' %}"></script>
  <script defer src="{% static 'js/payments/pay_page.js' %}"></script>
  <script defer src="{% static 'js/payments/list.js' %}"></script>
  <script defer src="{% static 'js/transactions/list.js' %}"></script>
  <script defer src="{% static 'js/orders/seller_order_detail.js' %}"></script>
  <script defer src="{% static 'js/orders/buyer_list.js' %}"></script>
  <script defer src="{% static 'js/orders/buyer_order_detail.js' %}"></script>
  <script defer src="{% static 'js/orders/seller_list.js' %}"></script>
  <script defer src="{% static 'js/orders/offline_form.js' %}"></script>
  <script defer src="{% static 'js/orders/pawn_form.js' %}"></script>
  <script defer src="{% static 'js/pawns/user_list.js' %}"></script>
  <script defer src="{% static 'js/pawns/user_detail.js' %}"></script>
  <script defer src="{% static 'js/pawns/seller_list.js' %}"></script>
  <script defer src="{% static 'js/pawns/seller_detail.js' %}"></script>
  <script defer src="{% static 'js/pawns/seller_pawn_form.js' %}"></script>
  <script defer src="{% static 'js/coupons/catalog.js' %}"></script>
  <script defer src="{% static 'js/coupons/my_list.js' %}"></script>
  <script defer src="{% static 'js/chat/inbox.js' %}"></script>
  <script defer src="{% static 'js/chat/thread.js' %}"></script>
  <script defer src="{% static 'js/saved/my_saved.js' %}"></script>
  <script defer src="{% static 'js/saved/saved_results.js' %}"></script>
  <script defer src="{% static 'js/home/landing.js' %}"></script>
  <script defer src="{% static 'js/listings/mod_panel.js' %}"></script>



  <!-- SSF (katalog) -->
  <link rel="stylesheet" href="{% static 'catalog/simple_schema_form.css' %}">
  <script defer src="{% static 'catalog/simple_schema_form.js' %}"></script>

  <!-- Numstep (global delegat) -->
  <script defer src="{% static 'js/core/numstep_delegate.js' %}"></script>

  <script>
      window.app = window.app || {};
      var app = window.app;
    </script>

  <!-- Alpine -->
  <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.15.3/dist/cdn.min.js"></script>
  <script defer src="https://unpkg.com/alpinejs@3.15.0/dist/cdn.min.js"></script>

</head>
<body class="min-h-screen bg-base-100 text-base-content">
  <!-- HEADER -->
  <header class="sticky top-0 z-50 backdrop-blur supports-[backdrop-filter]:bg-base-100/70 border-b border-base-300">
    <div class="mx-auto max-w-6xl px-4 py-3 flex items-center gap-4"
         x-data="app.navState()">
      <!-- Logo -->
      <a class="flex items-center gap-2 font-semibold text-lg hover:opacity-90 transition"
         href="/" hx-boost="true" hx-target="#app-root" hx-push-url="true">
        <span class="inline-block h-6 w-6 rounded-full bg-gradient-to-tr from-primary to-accent shadow-inner"></span>
        MyCent
      </a>

      <!-- Menu ogólne -->
        <nav class="ml-4 show-from-600 items-center gap-1 text-sm whitespace-nowrap"
             hx-boost="true" hx-target="#app-root" hx-push-url="true">
          <a class="navlink" href="/offers">Ogłoszenia</a>
          <a class="navlink" href="/pawns">Zastawy</a>
          <a class="navlink" href="/coupons/shop">Kupony</a>
        </nav>

      <!-- Prawa strona -->
      <div class="ml-auto flex items-center gap-2">
        <button type="button"
        class="btn-theme"
        @click="toggleTheme()"
        :aria-label="theme==='lownDark' ? 'Włącz jasny motyw' : 'Włącz ciemny motyw'">
          <!-- Słońce (jasny) -->
          <svg x-show="theme!=='lownDark'" x-cloak viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
          </svg>

          <!-- Księżyc (ciemny) -->
          <svg x-show="theme==='lownDark'" x-cloak viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7.5 7.5 0 0 0 9.8 9.8Z"></path>
          </svg>
        </button>


        <a class="btn btn-ghost btn-sm relative"
           href="/cart" data-requires-auth
           hx-boost="true" hx-target="#app-root" hx-push-url="true"
           aria-label="Koszyk">
          <span class="text-lg">🛒</span>
          <span class="badge badge-sm badge-primary absolute -top-1 -right-1"
                x-show="cartCount>0" x-text="cartCount" x-cloak></span>
        </a>

        <a class="btn btn-ghost btn-sm relative"
           href="/chat" data-requires-auth
           hx-boost="true" hx-target="#app-root" hx-push-url="true"
           aria-label="Wiadomości">
          <span class="text-lg">💬</span>
          <span class="badge badge-sm badge-primary absolute -top-1 -right-1"
                x-show="chatUnread>0" x-text="chatUnread" x-cloak></span>
        </a>

<!--        <a class="btn btn-ghost btn-sm" href="/admin/" hx-boost="false" data-no-boost>Admin</a>-->

        <!-- Niezalogowany -->
        <template x-if="!authed">
          <div class="flex items-center gap-1">
            <a class="btn btn-ghost btn-sm" href="/login">Zaloguj</a>
            <a class="btn btn-primary btn-sm btn-gold" href="/register">Zarejestruj</a>
          </div>
        </template>

        <!-- Zalogowany: avatar + DROPDOWN -->
        <template x-if="authed">
          <div class="relative isolate user-menu"
               x-data="app.userMenu()"
               x-init="$nextTick(() => setAnchor($refs.btn))"
               @mouseenter="enter()" @mouseleave="leave()"
               @resize.window="open && _place()"
               @scroll.window.passive="open && _place()">

            <button x-ref="btn" type="button"
                    class="user-menu__btn"
                    :class="open ? 'is-open' : ''"
                    @click="toggle()" aria-haspopup="menu" :aria-expanded="open" aria-label="Otwórz menu użytkownika">
              <img :src="user?.user_image || 'https://placehold.co/64x64?text=%F0%9F%91%A4'"
                   alt="" class="user-menu__avatar rounded-full">
              <span class="hidden sm:inline text-sm truncate max-w-[10rem]"
                    x-text="user?.first_name || user?.email || 'Konto'"></span>
              <span class="user-menu__caret" aria-hidden="true"></span>
            </button>

            <!-- Panel (fixed) -->
            <div x-show="open" x-cloak
                 :style="style"
                 class="fixed user-menu__panel dropdown-panel shadow-xl p-2 z-[120]"
                 :data-side="side"
                 x-transition.opacity.duration.120ms
                 x-transition.scale.origin.top.right.duration.120ms
                 @keydown.escape.stop.prevent="close()"
                 @click.outside="close()">
              <ul class="menu menu-sm">
                <li x-show="canAdminPanel" x-cloak>
                  <a href="/admin/" hx-boost="false" data-no-boost>Panel administratora</a>
                </li>
                <li x-show="isModerator" x-cloak><a href="/moderation" data-requires-auth hx-boost="true" hx-target="#app-root" hx-push-url="true">Moderacja</a></li>
                <li><a href="/profile" data-requires-auth hx-boost="true" hx-target="#app-root" hx-push-url="true">Profil</a></li>
                <li><a href="/chat" data-requires-auth hx-boost="true" hx-target="#app-root" hx-push-url="true">Wiadomości</a></li>
                <li><a href="/saved" data-requires-auth hx-boost="true" hx-target="#app-root" hx-push-url="true">Zapisane</a></li>
                <li><a href="/me" data-requires-auth hx-boost="true" hx-target="#app-root" hx-push-url="true">Moje ogłoszenia</a></li>
                <li><a href="/transactions" data-requires-auth hx-boost="true" hx-target="#app-root" hx-push-url="true">Moje transakcje</a></li>
<!--                <li><a href="/payments" data-requires-auth hx-boost="true" hx-target="#app-root" hx-push-url="true">Moje płatności</a></li>-->
                <li><a href="/coupons" data-requires-auth hx-boost="true" hx-target="#app-root" hx-push-url="true">Moje kupony</a></li>
                <li><a href="/pawns" data-requires-auth hx-boost="true" hx-target="#app-root" hx-push-url="true">Moje zastawy</a></li>
                <li x-show="hasSeller" x-cloak><a href="/seller/pawns" data-requires-auth hx-boost="true" hx-target="#app-root" hx-push-url="true">Zastawy (sprzedawca)</a></li>
                <li><a href="/orders" data-requires-auth hx-boost="true" hx-target="#app-root" hx-push-url="true">Moje zamówienia</a></li>
                <li x-show="hasSeller" x-cloak><a href="/seller/orders" data-requires-auth hx-boost="true" hx-target="#app-root" hx-push-url="true">Zamówienia (sprzedawca)</a></li>
                <li x-show="hasSeller" x-cloak>
                  <a href="/seller" data-requires-auth hx-boost="true" hx-target="#app-root" hx-push-url="true">Mój sklep</a>
                </li>
                <li><button @click="logout()">Wyloguj</button></li>
              </ul>
            </div>
          </div>
        </template>
      </div>
    </div>
  </header>

    <main id="app-root"
          class="mx-auto max-w-6xl px-4 py-8"
          hx-boost="true"
          hx-target="this"
          hx-swap="innerHTML"
          hx-push-url="true"
          hx-history-elt
          hx-indicator="#route-indicator">
      {% block content %}{% endblock %}
    </main>

  <div id="route-indicator" class="route-indicator htmx-indicator" aria-hidden="true">
    <div class="route-indicator__bar"></div>
  </div>

  <footer class="mt-12 border-t border-base-300">
    <div class="mx-auto max-w-6xl px-4 py-8 text-sm opacity-70">
      © MyCent - All Right Reserved
    </div>
  </footer>

  <!-- GLOBALNE TOASTY -->
  <div id="toasts" x-data="app.toasts()" class="toast-tray">
    <template x-for="t in items" :key="t.id">
      <div x-show="t.show"
           x-transition:enter="duration-300 ease-out"
           x-transition:enter-start="opacity-0 translate-y-10 scale-[.98]"
           x-transition:enter-end="opacity-100 translate-y-0 scale-100"
           x-transition:leave="duration-200 ease-in"
           x-transition:leave-start="opacity-100 translate-y-0"
           x-transition:leave-end="opacity-0 translate-y-3"
           class="toast-card"
           :class="{
             'is-success': t.type==='success',
             'is-error':   t.type==='error',
             'is-warning': t.type==='warning',
             'is-info':    t.type==='info'
           }"
           :role="role(t)" :aria-live="aria(t)"
           @mouseenter="pause(t)" @mouseleave="resume(t)">
        <div class="toast-icon" aria-hidden="true">
          <svg x-show="t.type==='success'" viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M9.0 16.2l-3.5-3.5 1.4-1.4 2.1 2.1 5.6-5.6 1.4 1.4z"/></svg>
          <svg x-show="t.type==='error'"   viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm1 14h-2v-2h2v2zm0-4h-2V6h2v6z"/></svg>
          <svg x-show="t.type==='warning'" viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>
          <svg x-show="t.type==='info' || !t.type" viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M11 9h2V7h-2v2zm0 8h2v-6h-2v6zm1-14a10 10 0 100 20 10 10 0 000-20z"/></svg>
        </div>
        <div class="toast-body" x-text="t.message"></div>
        <button class="toast-close" @click="close(t.id)" aria-label="Zamknij">✕</button>
      </div>
    </template>
  </div>


  <div id="global-loader" class="global-loader" role="status" aria-live="polite" aria-hidden="true">
  <div class="global-loader__panel">
    <div class="loader-spinner" aria-hidden="true"></div>
    <div class="global-loader__text">Ładowanie…</div>
  </div>
</div>

  <div id="overlays" class="overlay-root"></div>
</body>
</html>
