{% extends "email/_base.html" %}
{% block content %}
  <p style="margin:0 0 16px;color:#374151;">Cześć {{ first_name }}!</p>
  <p style="margin:0 0 16px;color:#374151;">
    Twoje zamówienie <strong>{{ order.public_id }}</strong> zostało wysłane.
  </p>
  <p style="margin:0 0 16px;">
    <a href="{{ order_url }}" style="display:inline-block;padding:12px 18px;border-radius:8px;background:#111827;color:#ffffff;text-decoration:none;font-weight:600;">
      Zobacz szczegóły przesyłki
    </a>
  </p>
  <p style="margin:0;color:#6b7280;word-break:break-all;">Gdyby przycisk nie działał: {{ order_url }}</p>
  <p style="margin:16px 0 0;color:#374151;">Dziękujemy za zakupy w {{ site_name }}!</p>
{% endblock %}
