<!-- CATEGORY PICKER (DaisyUI modal) -->
<template x-teleport="#overlays">
  <div class="modal" :class="catPicker.open ? 'modal-open' : ''"
       x-show="catPicker.open"
       x-transition.opacity.duration.120ms
       role="dialog" aria-modal="true"
       @keydown.escape.window="catPicker.close()"
       @click.self="catPicker.close()">
    <div class="modal-box w-full max-w-2xl p-0 bg-base-100">
      <!-- Header -->
      <div class="px-4 py-3 border-b border-base-300 flex items-center justify-between">
        <div class="font-semibold">Wybierz kategorię</div>
        <button type="button" class="btn btn-ghost btn-sm" @click="catPicker.close()">✕</button>
      </div>

      <!-- Body (scrollable) -->
      <div class="p-4 pt-3 max-h-[65vh] overflow-y-auto cm-soft-scroll">
        <div class="text-sm opacity-70 flex flex-wrap gap-1 mb-3">
          <button type="button" class="link" @click="catPicker.backTo(0)">Start</button>
          <template x-for="(c,i) in catPicker.crumbs" :key="c.path">
            <div class="flex items-center gap-1">
              <span>›</span>
              <button type="button" class="link" @click="catPicker.backTo(i+1)" x-text="c.name"></button>
            </div>
          </template>
        </div>

        <div class="grid-cards grid-autofill-220 items-stretch content-start">
          <template x-if="catPicker.loading">
            <div class="col-span-full">
              <div class="card card-compact border border-base-300 bg-base-100">
                <div class="card-body">
                  <div class="skeleton h-5 w-40"></div>
                  <div class="skeleton h-5 w-56"></div>
                  <div class="skeleton h-5 w-48"></div>
                </div>
              </div>
            </div>
          </template>

          <template x-for="n in catPicker.nodes" :key="n.path">
            <button type="button"
                    class="ci-card text-left hover:bg-base-200/60"
                    @click="catPicker.pick(n)">
              <div class="ci-title" x-text="n.name"></div>
              <div class="ci-path" x-text="n.path"></div>
              <div class="mt-1 text-xs opacity-60"
                   x-text="Number(n.children_count) ? 'Ma podkategorie' : 'Kategoria końcowa'"></div>
            </button>
          </template>
        </div>
      </div>

      <!-- Footer -->
      <div class="px-4 pb-4 border-t border-base-300 flex justify-end gap-2">
        <button type="button" class="btn" @click="catPicker.close()">Zamknij</button>
      </div>
    </div>
  </div>
</template>

<!-- CATALOG ITEM PICKER (DaisyUI modal) -->
<template x-teleport="#overlays">
  <div class="modal" :class="ciPicker.open ? 'modal-open' : ''"
       x-show="ciPicker.open"
       x-transition.opacity.duration.120ms
       role="dialog" aria-modal="true"
       @keydown.escape.window="ciPicker.close()"
       @click.self="ciPicker.close()">
    <div class="modal-box w-full max-w-3xl p-0 bg-base-100">
      <!-- Header -->
      <div class="px-4 py-3 border-b border-base-300 flex items-center gap-2">
        <div class="font-semibold">Wybierz z katalogu</div>
        <div class="ml-auto flex items-center gap-2">
          <input class="input input-bordered input-sm w-48"
                 placeholder="Szukaj (min 2 znaki)"
                 x-model="ciPicker.q"
                 @keydown.enter.prevent="ciPicker.search()">
          <button type="button" class="btn btn-sm" @click="ciPicker.search()">Szukaj</button>
          <button type="button" class="btn btn-ghost btn-sm" @click="ciPicker.close()">✕</button>
        </div>
      </div>

      <!-- Body (scrollable) -->
      <div class="p-4 max-h-[65vh] overflow-y-auto cm-soft-scroll">
        <template x-if="ciPicker.loading">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
            <div class="card card-compact border border-base-300 bg-base-100">
              <div class="card-body gap-2">
                <div class="skeleton h-5 w-24"></div>
                <div class="skeleton h-4 w-40"></div>
                <div class="skeleton h-4 w-28"></div>
                <div class="skeleton h-8 w-full"></div>
              </div>
            </div>
            <div class="hidden sm:block card card-compact border border-base-300 bg-base-100">
              <div class="card-body gap-2">
                <div class="skeleton h-5 w-28"></div>
                <div class="skeleton h-4 w-44"></div>
                <div class="skeleton h-4 w-24"></div>
                <div class="skeleton h-8 w-full"></div>
              </div>
            </div>
          </div>
        </template>

        <div class="grid-cards grid-autofill-240 items-stretch content-start" x-show="!ciPicker.loading">
          <template x-for="it in ciPicker.items" :key="it.id || it.public_id">
            <button type="button"
                    class="ci-card text-left hover:bg-base-200/60"
                    @click="ciPicker.pick(it)">
              <div class="ci-head">
                <div class="ci-thumb">
                  <img :src="app.imgUrl(it.image_path || it.image_url || it.image)" alt="">
                </div>
                <div class="min-w-0">
                  <div class="ci-title" x-text="it.item_name"></div>
                  <div class="ci-path"  x-text="it.type?.path || ''"></div>
                </div>
              </div>

              <div class="attr-pills mt-2">
                <template x-for="pair in ciPicker.pairsFor(it).slice(0,8)" :key="pair[0] + (ciPicker.uiNonce || 0)">
                  <span class="attr-pill" :title="pair[0] + ': ' + String(pair[1])">
                    <span class="k" x-text="pair[0] + ':'"></span>
                    <span class="v" x-text="pair[1]"></span>
                  </span>
                </template>
                <span class="text-[11px] opacity-60"
                      x-show="ciPicker.pairsFor(it).length === 0">brak atrybutów</span>
              </div>

              <div class="ci-spacer"></div>
            </button>
          </template>

          <div class="col-span-full" x-show="!ciPicker.items || ciPicker.items.length === 0">
            <div class="alert alert-info">
              <span>Brak wyników. Zmień frazę lub zawęź kategorię.</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Footer -->
      <div class="px-4 pb-4 border-t border-base-300 flex items-center justify-between">
        <div class="text-xs opacity-70">Podgląd kategorii: <span x-text="ciPicker.typePath || '— dowolna —'"></span></div>
        <div class="flex gap-2">
          <button type="button" class="btn btn-sm btn-outline" :disabled="!ciPicker.next" @click="ciPicker.more()">Więcej…</button>
          <button type="button" class="btn btn-sm" @click="ciPicker.close()">Zamknij</button>
        </div>
      </div>
    </div>
  </div>
</template>
