<section
  x-data="app.publicOffersList()"
  x-init="init()"
  x-effect="() => { return () => destroy() }"
>
  <!-- Nagłówek + akcje -->
  <div class="mb-4 flex items-center gap-2 flex-wrap">
    <h1 class="text-xl font-semibold">Ogłoszenia</h1>
    <div class="offers-actions">
      <button class="btn btn-ghost btn-sm w-full sm:w-auto" @click="resetAll()">Wyczyść wszystko</button>
      <button class="btn btn-primary btn-sm btn-gold w-full sm:w-auto" @click="saveCurrentSearch()">Zapisz to wyszukiwanie</button>
    </div>
  </div>

  <!-- Podstawowe filtry (na stronie) -->
  <div class="mb-3 grid grid-cols-1 md:grid-cols-12 gap-2">
    <!-- Wyszukiwarka -->
    <div class="md:col-span-6">
      <div class="join w-full">
        <input class="input input-bordered join-item w-full" placeholder="Szukaj tytułu/opisu…" x-model="q" @input="onSearchInput">
        <button class="btn join-item" @click="reload()">Szukaj</button>
      </div>
    </div>

    <!-- Kategoria -->
    <div class="md:col-span-3 flex items-center gap-2">
      <button class="btn btn-outline w-full md:w-auto" type="button" @click="openCategoryPicker()">Kategoria</button>
      <template x-if="selectedType">
        <div class="badge badge-ghost flex items-center gap-1">
          <span class="truncate max-w-[12rem]" x-text="selectedType?.path"></span>
          <button class="ml-1" @click="clearCategory()" aria-label="Wyczyść kategorię">✕</button>
        </div>
      </template>
    </div>

    <!-- Sortowanie -->
    <div class="md:col-span-2">
      <select class="select select-bordered fancy-select w-full" x-model="ordering" @change="reload()">
        <option value="-created_at">Najnowsze</option>
        <option value="created_at">Najstarsze</option>
        <option value="-price">Cena ⬇︎</option>
        <option value="price">Cena ⬆︎</option>
      </select>
    </div>

    <!-- Filtry -->
    <div class="md:col-span-1">
      <button class="btn btn-filter w-full"
              @click="filtersOpen = true"
              :aria-expanded="filtersOpen ? 'true' : 'false'">
        Filtry
        <span class="badge badge-ghost btn-filter__badge" x-show="filtersCount() > 0" x-cloak
              x-text="filtersCount()"></span>
      </button>
    </div>
  </div>

  <!-- Skeleton -->
  <template x-if="loading && !items.length">
    <div class="space-y-1">
      <template x-for="i in 6" :key="i">
        <div class="p-3 rounded-lg border list-row flex items-start gap-3 animate-pulse overflow-hidden">
          <div class="list-thumb rounded bg-base-300"></div>
          <div class="grow min-w-0">
            <div class="h-4 w-2/3 rounded bg-base-300 mb-2"></div>
            <div class="h-3 w-1/3 rounded bg-base-300"></div>
          </div>
          <div class="w-20 h-7 rounded bg-base-300"></div>
        </div>
      </template>
    </div>
  </template>

  <template x-if="err"><div class="alert alert-error whitespace-pre-line mt-2" x-text="err"></div></template>

  <!-- Lista ogłoszeń -->
  <div class="offers-list space-y-1" x-show="!loading && items.length">
    <template x-for="it in items" :key="it.public_id || it.id">
      <!-- Karta wiersza -->
      <div class="p-3 rounded-lg border list-row flex items-start gap-3 relative cursor-pointer overflow-hidden"
           role="button" tabindex="0"
           @click="gotoItem(it)"
           @keydown.enter.prevent="gotoItem(it)"
           @keydown.space.prevent="gotoItem(it)">

        <!-- Miniatura -->
        <img :src="img(it)" alt="" class="list-thumb object-cover rounded border">

        <!-- Treść -->
        <div class="offer-body grow min-w-0">
          <!-- Tytuł -->
          <div class="font-medium truncate mb-0.5" x-text="it.set_name || '(bez nazwy)'"></div>

          <!-- Cena + ścieżka kategorii -->
          <div class="flex items-center gap-2 flex-wrap">
            <span class="item-price item-price--soft" x-text="priceText(it)"></span>
            <span class="text-sm opacity-70 truncate">
              · <span x-text="it.type?.path || '—'"></span>
            </span>
          </div>

          <!-- Meta (wiersz 1): źródło + typ ogłoszenia (mapowany) -->
          <div class="mt-1 text-xs flex flex-wrap items-center gap-1">
            <span class="badge badge-ghost" x-text="who(it)"></span>
            <template x-if="it.listing_type">
              <span class="badge badge-ghost" x-text="listingTypePL(it)"></span>
            </template>
          </div>

          <!-- Meta (wiersz 2): katalog (przeniesione niżej, osobno) -->
          <template x-if="it.catalog_item?.item_name">
            <div class="mt-1 text-xs">
              <span class="badge badge-ghost" x-text="it.catalog_item.item_name"></span>
            </div>
          </template>
        </div>

        <!-- Prawa szyna: serce (góra), data (dół) -->
        <div class="offer-rail">
          <button class="btn btn-ghost btn-xs save-btn pointer-events-auto"
                  :class="it.is_saved ? 'text-error' : ''"
                  :aria-pressed="it.is_saved ? 'true' : 'false'"
                  :disabled="!!saveBusy[it.public_id]"
                  title="Zapisz / usuń z zapisanych"
                  @click.stop="toggleSave(it)">
            <span x-show="!it.is_saved">♡</span>
            <span x-show="it.is_saved" x-cloak>❤</span>
          </button>

          <div class="item-date" aria-label="Data utworzenia">
            <span x-text="createdText(it)"></span>
          </div>
        </div>
      </div>
    </template>

    <div class="pt-2 flex justify-center" x-show="next">
      <button class="btn btn-outline" @click="more()">Pokaż więcej</button>
    </div>
    <div x-ref="sentinel" class="h-2"></div>
  </div>

  <template x-if="!loading && !items.length && !err">
    <div class="text-sm opacity-70">Brak wyników dla podanych filtrów.</div>
  </template>

  <!-- MODAL FILTRÓW -->
  <template x-teleport="#overlays">
    <div class="modal" :class="filtersOpen ? 'modal-open' : ''"
         x-show="filtersOpen"
         x-transition.opacity.duration.120ms
         role="dialog" aria-modal="true"
         @keydown.escape.window="closeFilters()"
         @click.self="closeFilters()">
      <div class="modal-box w-full max-w-3xl p-0 bg-base-100">
        <div class="px-4 py-3 border-b border-base-300 flex items-center justify-between">
          <div class="font-semibold">Filtry</div>
          <button type="button" class="btn btn-ghost btn-sm" @click="closeFilters()">✕</button>
        </div>

        <div class="p-4 max-h-[70vh] overflow-y-auto cm-soft-scroll">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
            <div class="flex flex-col gap-2">
              <label class="text-sm font-medium">Źródło</label>
              <div class="join">
                <button class="btn btn-sm join-item" :class="source==='ALL'?'btn-primary':'btn-outline'"   @click="source='ALL'">wszyscy</button>
                <button class="btn btn-sm join-item" :class="source==='STAFF'?'btn-primary':'btn-outline'" @click="source='STAFF'">sprzedawcy</button>
                <button class="btn btn-sm join-item" :class="source==='USER'?'btn-primary':'btn-outline'"  @click="source='USER'">użytkownicy</button>
              </div>
            </div>

            <div class="flex flex-col gap-2">
              <label class="text-sm font-medium">Typ ogłoszenia</label>
              <select class="select select-bordered fancy-select select-sm w-full" x-model="listing_type">
                <option value="ANY">Wszystkie</option>
                <option value="LISTING">Ogłoszenie</option>
                <option value="BUY">Kup teraz</option>
                <option value="EXCHANGE">Wymiana</option>
              </select>
            </div>

            <div class="flex flex-col gap-2">
              <label class="text-sm font-medium">Stan</label>
              <select class="select select-bordered fancy-select select-sm w-full" x-model="condition">
                <option value="ANY">Wszystkie</option>
                <option value="NEW">Nowy</option>
                <option value="USED">Używany</option>
                <option value="DAMAGED">Uszkodzony</option>
              </select>
            </div>

            <div class="flex items-center gap-2 mt-6 md:mt-8">
              <input id="allow_checkout_only" type="checkbox" class="toggle toggle-sm" x-model="allow_checkout_only">
              <label for="allow_checkout_only" class="text-sm">Tylko z zakupem online</label>
            </div>

            <div class="md:col-span-2">
              <label class="text-sm font-medium">Cena</label>
              <div class="join w-full mt-1">
                <input class="input input-bordered input-sm join-item w-1/2" placeholder="Cena min" x-model="price_min" inputmode="decimal">
                <input class="input input-bordered input-sm join-item w-1/2" placeholder="Cena max" x-model="price_max" inputmode="decimal">
                <button class="btn btn-sm join-item" @click="applyFilters()">OK</button>
              </div>
            </div>
          </div>
        </div>

        <div class="px-4 pb-4 border-t border-base-300 flex justify-between gap-2">
          <button type="button" class="btn btn-outline btn-sm" @click="resetAdvanced()">Wyczyść filtry</button>
          <div class="flex gap-2">
            <button type="button" class="btn btn-ghost btn-sm" @click="closeFilters()">Anuluj</button>
            <button type="button" class="btn btn-sm btn-primary" @click="applyFilters()">Zastosuj</button>
          </div>
        </div>
      </div>
    </div>
  </template>

  {% include 'app/partials/_catalog_pick_modals.html' %}
</section>
