<section class="max-w-5xl mx-auto px-3 md:px-0"
         x-data="app.savedListingsPage()"
         x-init="init()">

  <h1 class="text-2xl font-semibold mb-3">Zapisane ogłoszenia</h1>

  <template x-if="err"><div class="alert alert-error mb-3" x-text="err"></div></template>

  <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
    <template x-for="row in items" :key="row.public_id">
      <div class="cm-card p-3 flex flex-col">
        <div class="aspect-[4/3] rounded-lg overflow-hidden border bg-base-200">
          <img :src="img(row.item?.cover_image_url || row.item?.catalog_item?.image_path)"
               alt="" class="w-full h-full object-cover">
        </div>
        <div class="mt-2 font-medium line-clamp-2" x-text="row.item?.set_name || '(bez nazwy)'"></div>
        <div class="text-sm opacity-70">
          <span x-text="row.item?.type?.path || ''"></span>
        </div>
        <div class="mt-1 font-semibold" x-text="priceText(row.item?.price)"></div>

        <div class="mt-2 flex gap-2">
          <button class="cm-btn flex-1" @click="gotoItem(row.item?.slug)">Zobacz</button>
          <button class="cm-btn" title="Usuń z zapisanych" @click="unsave(row.item?.public_id)">✕</button>
        </div>
      </div>
    </template>
  </div>

  <div class="flex justify-center my-4" x-show="next">
    <button class="cm-btn" :disabled="loading" @click="loadMore()" x-text="loading ? 'Ładowanie…' : 'Wczytaj więcej'"></button>
  </div>

  <template x-if="!loading && !items.length && !err">
    <div class="mt-8 text-center opacity-70">Nie masz jeszcze zapisanych ogłoszeń.</div>
  </template>
</section>
