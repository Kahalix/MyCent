<section
  x-data="app.moderationUserOffersList()"
  x-init="init()"
  x-effect="() => { return () => destroy() }"
>
  <div class="mb-4 space-y-2">
    <div class="flex flex-wrap items-center gap-2">
      <h1 class="text-xl font-semibold">Moderacja ogłoszeń użytkowników</h1>
      <button class="btn btn-ghost btn-sm" @click="resetAll()">Wyczyść filtry</button>

      <div class="ml-auto flex items-center gap-2">
        <label for="mod-offers-ordering" class="text-xs opacity-70">Sortowanie:</label>
        <select
          id="mod-offers-ordering"
          class="select select-bordered select-sm fancy-select"
          x-model="ordering"
          @change="reload()"
        >
          <option value="-created_at">Najnowsze</option>
          <option value="created_at">Najstarsze</option>
          <option value="-price">Cena ⬇︎</option>
          <option value="price">Cena ⬆︎</option>
        </select>
      </div>
    </div>

    <div class="flex flex-wrap items-center gap-2">
      <div class="join w-full sm:w-auto">
        <input
          class="input input-bordered join-item w-full sm:w-64"
          placeholder="Szukaj…"
          x-model="q"
          @input="onSearchInput"
        >
        <button class="btn join-item" @click="reload()">Szukaj</button>
      </div>

      <div class="flex flex-wrap items-center gap-2">
        <template x-for="s in statusesAll" :key="s.code">
          <label class="label cursor-pointer gap-2">
            <input
              type="checkbox"
              class="checkbox checkbox-sm"
              :checked="statusSel.has(s.code)"
              @change="toggleStatusFilter(s.code)"
            >
            <span class="label-text text-sm" x-text="s.label"></span>
          </label>
        </template>
        <button class="btn btn-ghost btn-sm" @click="clearStatuses()">Wyczyść statusy</button>
      </div>
    </div>
  </div>

  <template x-if="loading && !items.length">
    <div class="space-y-1">
      <template x-for="i in 6" :key="i">
        <div class="p-3 rounded-lg border list-row flex items-start gap-3 animate-pulse overflow-hidden">
          <div class="list-thumb rounded bg-base-300"></div>
          <div class="grow min-w-0">
            <div class="h-4 w-2/3 rounded bg-base-300 mb-2"></div>
            <div class="h-3 w-1/3 rounded bg-base-300"></div>
          </div>
          <div class="w-20 h-7 rounded bg-base-300"></div>
        </div>
      </template>
    </div>
  </template>

  <template x-if="err">
    <div class="alert alert-error whitespace-pre-line mt-2" x-text="err"></div>
  </template>

  <div class="space-y-1" x-show="!loading && items.length">
    <template x-for="it in items" :key="it.public_id || it.id">
      <div class="p-3 rounded-lg border list-row flex items-start gap-3 relative overflow-hidden">
        <img :src="img(it)" alt="" class="list-thumb object-cover rounded border">
        <div class="grow min-w-0">
          <div class="font-medium truncate" x-text="it.set_name || '(bez nazwy)'"></div>
          <div class="text-sm opacity-70">
            <span class="item-price" x-text="priceText(it)"></span>
            <span class="mx-1">·</span>
            <span x-text="it.type?.path || '—'"></span>
          </div>
          <div class="mt-1 text-xs flex flex-wrap items-center gap-1">
            <span class="badge badge-ghost inline-flex items-center gap-1">
              <span class="w-2 h-2 rounded-full" :class="statusDotClass(it.status)"></span>
              <span x-text="statusLabel(it.status)"></span>
            </span>
            <template x-if="ownerText(it)">
              <span class="badge badge-ghost" x-text="ownerText(it)"></span>
            </template>
          </div>
        </div>

        <div class="list-actions">
          <div class="join">
            <button
              class="btn btn-sm join-item"
              @click="changeStatus(it, 'AVAILABLE')"
              :disabled="it.status==='AVAILABLE'"
            >
              Aktywuj
            </button>
            <button
              class="btn btn-sm join-item"
              @click="changeStatus(it, 'SUSPENDED')"
              :disabled="it.status==='SUSPENDED'"
            >
              Zawieś
            </button>
          </div>
        </div>
      </div>
    </template>

    <div class="pt-2 flex justify-center" x-show="next">
      <button class="btn btn-outline btn-sm" @click="more()">Pokaż więcej</button>
    </div>
    <div x-ref="sentinel" class="h-2"></div>
  </div>

  <template x-if="!loading && !items.length && !err">
    <div class="text-sm opacity-70">Brak ogłoszeń pasujących do filtrów.</div>
  </template>
</section>
