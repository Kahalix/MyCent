<section class="max-w-xl mx-auto text-center py-16">
  <div class="text-6xl mb-4">⛔</div>
  <h1 class="text-2xl font-semibold mb-2">Brak uprawnień</h1>
  <p class="opacity-70 mb-1">Nie masz dostępu do tej strony lub operacji.</p>
  {% if reason %}
  <p class="opacity-70 mb-6">{{ reason }}</p>
  {% else %}
  <p class="opacity-70 mb-6">Jeśli to błąd, spróbuj odświeżyć lub zalogować się ponownie.</p>
  {% endif %}
  <div class="flex items-center justify-center gap-2">
    <a class="btn btn-primary btn-gold" href="/">Strona główna</a>
    <a class="btn" href="" onclick="history.back();return false;">Wróć</a>
  </div>
</section>
