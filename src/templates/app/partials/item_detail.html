<section class="max-w-5xl mx-auto"
         x-data="app.itemDetailPage({ slug: '{{ slug }}' })"
         x-init="init()">

<!--<title hx-swap-oob="true">{{ ... }} MyCent</title>-->
<meta name="description"
      content="{{ item.short_desc|default:'Ogłoszenie w Lown' }}"
      hx-swap-oob="true">

  <!-- Skeleton -->
  <template x-if="loading">
    <div class="grid md:grid-cols-2 gap-6 animate-pulse">
      <div class="aspect-square rounded-lg border bg-base-300"></div>
      <div>
        <div class="h-6 w-2/3 bg-base-300 rounded mb-3"></div>
        <div class="h-4 w-1/2 bg-base-300 rounded mb-2"></div>
        <div class="h-4 w-1/3 bg-base-300 rounded mb-6"></div>
        <div class="h-10 w-40 bg-base-300 rounded"></div>
      </div>
    </div>
  </template>

  <!-- Error -->
  <template x-if="err"><div class="alert alert-error mt-2" x-text="err"></div></template>

  <!-- Content -->
  <div class="grid md:grid-cols-2 gap-6" x-show="!loading && item">
    <!-- Galeria -->
    <div>
      <div class="item-gallery">
        <!-- Podgląd główny -->
        <div class="item-gallery__main group">
          <template x-if="imgs().length">
            <button type="button" class="w-full h-full grid place-items-center"
                    @click="openLightbox()"
                    title="Kliknij, aby powiększyć">
              <img :src="app.imgUrl(imgs()[curIdx])"
                   class="transition-transform duration-200 group-hover:scale-[1.01]" alt="">
            </button>
          </template>
          <template x-if="!imgs().length">
            <div class="item-gallery__placeholder">
              Brak zdjęć<br><span class="opacity-70 text-xs">Skontaktuj się z wystawiającym o fotografie</span>
            </div>
          </template>

          <div class="item-gallery__count" x-show="imgs().length"
               x-text="(curIdx+1) + ' / ' + imgs().length"></div>
        </div>

        <!-- Miniatury -->
        <div class="item-gallery__thumbs" x-show="imgs().length">
          <template x-for="(u, i) in imgs()" :key="i">
            <button type="button"
                    class="item-gallery__thumb"
                    :class="i===curIdx ? 'item-gallery__thumb--active' : ''"
                    @click="setIdx(i)">
              <canvas class="w-full h-full block"
                      x-init="app._paintThumb($el, app.imgUrl(u))"></canvas>
            </button>
          </template>
        </div>
      </div>
    </div>

    <!-- Szczegóły -->
    <div>
      <div class="mb-1 text-xs opacity-70 flex items-center gap-2">
        <template x-if="item?.type?.path">
          <a class="link link-hover" @click.prevent="gotoCategory()" x-text="item.type.path"></a>
        </template>
      </div>

      <h1 class="text-2xl font-semibold" x-text="item?.set_name || '(bez nazwy)'"></h1>

      <div class="mt-1 text-lg flex items-center flex-wrap gap-1">
      <span class="font-semibold" x-text="priceText()"></span>
      <span class="badge badge-ghost ml-1" x-text="condText()"></span>
      <span class="badge badge-ghost ml-1" x-text="typeText()"></span>
      <template x-if="item?.added_by">
        <span class="badge badge-outline ml-1" x-text="item.added_by === 'USER' ? 'użytkownik' : 'sprzedawca'"></span>
      </template>
    </div>


      <!-- Ilość dostępna -->
      <div class="mt-1 text-sm">
        Dostępne: <span class="font-medium" x-text="item?.stock_quantity ?? 0"></span> szt.
      </div>

      <!-- Sprzedający / Wystawiający -->
      <div class="mt-3 p-3 rounded border flex items-center gap-3">
        <!-- SPRZEDAWCA -->
        <template x-if="item?.seller_slug">
          <div class="flex items-center gap-3 min-w-0">
            <div class="w-10 h-10 rounded-full bg-base-200 grid place-items-center">🏪</div>
            <div class="min-w-0">
              <div class="font-medium truncate">
                <a class="link link-hover" @click.prevent="gotoSeller()" x-text="'Sklep: ' + item.seller_slug"></a>
              </div>
              <div class="text-xs opacity-70 truncate">sprzedawca</div>
            </div>
          </div>
        </template>

        <!-- UŻYTKOWNIK -->
        <template x-if="!item?.seller_slug && item?.owner?.public_id">
          <div class="flex items-center gap-3 min-w-0">
            <img :src="item.owner?.user_image || 'https://placehold.co/80x80?text=%F0%9F%91%A4'"
                 class="w-10 h-10 rounded-full object-cover border" alt="">
            <div class="min-w-0">
              <div class="font-medium truncate">
                <a class="link link-hover" @click.prevent="gotoOwner()"
                   x-text="(item.owner?.first_name || '') + ' ' + (item.owner?.last_name || '') || item.owner?.email || 'Użytkownik'"></a>
              </div>
              <div class="text-xs opacity-70 truncate">użytkownik</div>
            </div>
          </div>
        </template>

        <span class="ml-auto"></span>

        <!-- PRZYCISK ZAPISU -->
        <button class="btn btn-sm"
                :class="isSaved ? 'btn-ghost' : ''"
                :disabled="saveBusy"
                @click="toggleSave()">
          <template x-if="!isSaved">
            <span class="inline-flex items-center gap-1">♡ Zapisz</span>
          </template>
          <template x-if="isSaved">
            <span class="inline-flex items-center gap-1">❤ Zapisane</span>
          </template>
        </button>

        <button class="btn btn-sm" @click="startChat()" :disabled="chatBusy" x-text="chatBusy ? 'Uruchamianie…' : 'Rozpocznij czat'"></button>
      </div>

      <!-- Koszyk -->
      <div class="mt-3 p-3 rounded border">
        <template x-if="canBuy()">
          <div class="flex items-center gap-2">
            <input class="input input-bordered input-sm w-20" type="number" min="1" step="1" x-model="qty">
            <button class="btn btn-primary btn-gold btn-sm" :disabled="addBusy" @click="addToCart()"
                    x-text="addBusy ? 'Dodawanie…' : 'Dodaj do koszyka'"></button>
          </div>
        </template>
        <template x-if="!canBuy()">
          <div class="text-sm opacity-70">Ten przedmiot nie jest dostępny w zakupie online.</div>
        </template>
        <div class="text-xs mt-2">
          <span class="text-success" x-text="ok"></span>
          <span class="text-error whitespace-pre-line" x-text="err"></span>
        </div>
      </div>

      <!-- Opis -->
      <div class="mt-4 prose prose-sm max-w-none dark:prose-invert">
        <h3>Opis</h3>
        <p x-text="item?.description || 'Brak opisu.'"></p>
      </div>

      <!-- Atrybuty -->
      <template x-if="attrPairs().length">
          <div class="mt-4">
            <h3 class="font-medium mb-2">Parametry</h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-y-1 gap-x-6 text-sm">
              <template x-for="pair in attrPairs()" :key="pair[0]">
                <div class="flex justify-between gap-3">
                  <div class="opacity-70 truncate" x-text="pair[0]"></div>
                  <div class="font-medium text-right truncate" x-text="pair[1]"></div>
                </div>
              </template>
            </div>
          </div>
        </template>

      <!-- Wysyłka (jeśli jest) -->
      <template x-if="item?.shipping_options?.length">
        <div class="mt-4">
          <h3 class="font-medium mb-2">Wysyłka</h3>
          <div class="space-y-1 text-sm">
            <template x-for="o in item.shipping_options" :key="o.public_id">
              <div class="flex items-center gap-2">
                <div class="min-w-0">
                  <span class="font-medium" x-text="o.package_type?.provider || '—'"></span>
                  <span class="opacity-70 ml-1" x-text="o.package_type?.dimensions || ''"></span>
                </div>
                <span class="ml-auto opacity-80"
                      x-text="app.moneyText(o.effective_price || o.price_override || o.package_type?.price)"></span>
              </div>
            </template>
          </div>
        </div>
      </template>
    </div>
  </div>

  <!-- LIGHTBOX -->
  <div x-show="lightboxOpen"
       x-transition.opacity
       class="lb-overlay"
       @click.self="closeLightbox()"
       @keydown.window.escape="closeLightbox()"
       @keydown.window.arrow-right="lbNext()"
       @keydown.window.arrow-left="lbPrev()">
    <div class="absolute inset-0 flex items-center justify-center p-4">
      <img :src="app.imgUrl(imgs()[lbIdx])" class="lb-img select-none" alt="">
      <button type="button" class="btn btn-circle absolute left-4 md:left-8" @click.stop="lbPrev()">❮</button>
      <button type="button" class="btn btn-circle absolute right-4 md:right-8" @click.stop="lbNext()">❯</button>
      <div class="absolute bottom-3 left-1/2 -translate-x-1/2 text-xs px-2 py-1 rounded bg-base-100/90 border">
        <span x-text="(lbIdx+1) + ' / ' + imgs().length"></span>
        <span class="mx-1">•</span>
        <span>ESC, klik tło — zamknij</span>
      </div>
      <button type="button" class="btn btn-sm absolute top-3 right-3" @click="closeLightbox()">Zamknij</button>
    </div>
  </div>
</section>
