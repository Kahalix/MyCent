<section class="max-w-5xl mx-auto" data-protected>
  <h1 class="text-2xl font-semibold mb-4">Moje zamówienia</h1>
  <div x-data="app.buyerOrders()" x-init="init()">

    <template x-if="loading">
      <div class="space-y-1">
        <div class="p-3 rounded-lg border list-row animate-pulse bg-base-300/30"></div>
        <div class="p-3 rounded-lg border list-row animate-pulse bg-base-300/30"></div>
      </div>
    </template>
    <template x-if="err"><div class="alert alert-error my-3" x-text="err"></div></template>

    <!-- Lista: spójne odstępy -->
    <div class="space-y-1" x-show="!loading && !err">
      <template x-for="o in items" :key="o.public_id">
        <div class="p-3 rounded-lg border list-row flex items-center justify-between">
          <div>
            <div class="text-sm opacity-70">Zamówienie</div>
            <div class="font-mono text-xs" x-text="o.public_id"></div>
            <div class="text-xs opacity-70 mt-1">
              Status: <span class="font-medium" x-text="statusLabel(o.order_status)"></span>
            </div>
          </div>
          <div class="text-right">
            <div class="text-sm opacity-70">Kwota</div>
            <div class="font-semibold" x-text="app.moneyText(o.purchase_cost)"></div>
            <div class="mt-2 flex gap-2 justify-end">
              <a class="btn btn-sm btn-primary btn-gold"
                 :href="'/orders/'+o.public_id" hx-boost="true" hx-target="#app-root" hx-push-url="true">Szczegóły / wysyłka</a>
            </div>
          </div>
        </div>
      </template>
    </div>
  </div>
</section>
