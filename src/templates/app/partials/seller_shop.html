<section
  x-data="app.publicOffersList({ sellerSlug: '{{ seller_slug }}' })"
  x-init="init()"
  x-effect="() => { return () => destroy() }"
>
  <!-- Nagłówek + sort -->
  <div class="mb-4 flex items-center gap-2 flex-wrap">
    <h1 class="text-xl font-semibold">
      Sklep: <span class="opacity-70">{{ seller_slug }}</span>
    </h1>

    <button class="btn btn-ghost btn-sm" @click="resetAll()">Wyczyść filtry</button>

    <span class="ml-auto"></span>
    <div class="text-xs opacity-70">Sortowanie:</div>
    <select class="select select-bordered select-sm fancy-select"
            x-model="ordering" @change="reload()">
      <option value="-created_at">Najnowsze</option>
      <option value="created_at">Najstarsze</option>
      <option value="-price">Cena ⬇︎</option>
      <option value="price">Cena ⬆︎</option>
    </select>
  </div>

  <!-- Pasek filtrów (analogiczny do public offers) -->
  <div class="mb-3 grid grid-cols-1 md:grid-cols-12 gap-2">
    <!-- Szukaj -->
    <div class="md:col-span-6">
      <div class="join w-full">
        <input class="input input-bordered join-item w-full"
               placeholder="Szukaj w sklepie…" x-model="q" @input="onSearchInput">
        <button class="btn join-item" @click="reload()">Szukaj</button>
      </div>
    </div>

    <!-- Kategoria -->
    <div class="md:col-span-3 flex items-center gap-2">
      <button class="btn btn-outline w-full md:w-auto" type="button" @click="openCategoryPicker()">Kategoria</button>
      <template x-if="selectedType">
        <div class="badge badge-ghost flex items-center gap-1">
          <span class="truncate max-w-[12rem]" x-text="selectedType?.path"></span>
          <button class="ml-1" @click="clearCategory()" aria-label="Wyczyść kategorię">✕</button>
        </div>
      </template>
    </div>

    <!-- Typ -->
    <div class="md:col-span-2">
      <select class="select select-bordered fancy-select select-sm w-full"
              x-model="listing_type" @change="reload()">
        <option value="ANY">Typ (wszystkie)</option>
        <option value="LISTING">Ogłoszenie</option>
        <option value="BUY">Kup teraz</option>
        <option value="EXCHANGE">Wymiana</option>
      </select>
    </div>

    <!-- Stan + checkout + cena -->
    <div class="md:col-span-12 grid grid-cols-1 md:grid-cols-4 gap-2">
      <div>
        <select class="select select-bordered fancy-select select-sm w-full"
                x-model="condition" @change="reload()">
          <option value="ANY">Stan (wszystkie)</option>
          <option value="NEW">Nowy</option>
          <option value="USED">Używany</option>
          <option value="DAMAGED">Uszkodzony</option>
        </select>
      </div>

      <label class="label cursor-pointer justify-start gap-2">
        <input type="checkbox" class="toggle toggle-sm"
               x-model="allow_checkout_only" @change="reload()">
        <span class="label-text text-sm">Tylko z zakupem online</span>
      </label>

      <div class="md:col-span-2">
        <div class="join w-full">
          <input class="input input-bordered input-sm join-item w-1/2"
                 placeholder="Cena min" x-model="price_min" inputmode="decimal">
          <input class="input input-bordered input-sm join-item w-1/2"
                 placeholder="Cena max" x-model="price_max" inputmode="decimal">
          <button class="btn btn-sm join-item" @click="reload()">OK</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Skeleton (jak public offers) -->
  <template x-if="loading && !items.length">
    <div class="space-y-1">
      <template x-for="i in 6" :key="i">
        <div class="p-3 rounded-lg border list-row flex items-start gap-3 animate-pulse overflow-hidden">
          <div class="list-thumb rounded bg-base-300"></div>
          <div class="grow min-w-0">
            <div class="h-4 w-2/3 rounded bg-base-300 mb-2"></div>
            <div class="h-3 w-1/3 rounded bg-base-300"></div>
          </div>
          <div class="w-20 h-7 rounded bg-base-300"></div>
        </div>
      </template>
    </div>
  </template>

  <template x-if="err">
    <div class="alert alert-error whitespace-pre-line mt-2" x-text="err"></div>
  </template>

  <!-- Lista (klikana karta-wniersz + szyna: serce + data) -->
  <div class="offers-list space-y-1" x-show="!loading && items.length">
    <template x-for="it in items" :key="it.public_id || it.id">
      <div class="p-3 rounded-lg border list-row flex items-start gap-3 relative cursor-pointer overflow-hidden"
           role="button" tabindex="0"
           @click="gotoItem(it)"
           @keydown.enter.prevent="gotoItem(it)"
           @keydown.space.prevent="gotoItem(it)">

        <!-- Miniatura -->
        <img :src="img(it)" alt="" class="list-thumb object-cover rounded border">

        <!-- Treść -->
        <div class="offer-body grow min-w-0">
          <div class="font-medium truncate mb-0.5" x-text="it.set_name || '(bez nazwy)'"></div>

          <div class="flex items-center gap-2 flex-wrap">
            <span class="item-price item-price--soft" x-text="priceText(it)"></span>
            <span class="text-sm opacity-70 truncate">
              · <span x-text="it.type?.path || '—'"></span>
            </span>
          </div>

          <!-- Meta (bez „sprzedawca/użytkownik”) -->
          <div class="mt-1 text-xs flex flex-wrap items-center gap-1">
            <template x-if="it.listing_type">
              <span class="badge badge-ghost" x-text="listingTypePL(it)"></span>
            </template>
            <template x-if="it.catalog_item?.item_name">
              <span class="badge badge-ghost" x-text="it.catalog_item.item_name"></span>
            </template>
          </div>
        </div>

        <!-- Prawa szyna: serduszko + data -->
        <div class="offer-rail">
          <button class="btn btn-ghost btn-xs save-btn pointer-events-auto"
                  :class="it.is_saved ? 'text-error' : ''"
                  :aria-pressed="it.is_saved ? 'true' : 'false'"
                  :disabled="!!saveBusy[it.public_id]"
                  title="Zapisz / usuń z zapisanych"
                  @click.stop="toggleSave(it)">
            <span x-show="!it.is_saved">♡</span>
            <span x-show="it.is_saved" x-cloak>❤</span>
          </button>

          <div class="item-date" aria-label="Data utworzenia">
            <span x-text="createdText(it)"></span>
          </div>
        </div>
      </div>
    </template>

    <div class="pt-2 flex justify-center" x-show="next">
      <button class="btn btn-outline btn-sm" @click="more()">Pokaż więcej</button>
    </div>
    <div x-ref="sentinel" class="h-2"></div>
  </div>

  <template x-if="!loading && !items.length && !err">
    <div class="text-sm opacity-70">Brak produktów w tym sklepie dla wybranych filtrów.</div>
  </template>

  {% include 'app/partials/_catalog_pick_modals.html' %}
</section>
