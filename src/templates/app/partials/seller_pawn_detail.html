<section class="max-w-5xl mx-auto pawn-detail" data-protected
         x-data="app.sellerPawnDetail('{{ pawn_public_id }}')" x-init="init()">

  <!-- Pasek tytułowy -->
  <div class="flex items-center gap-2 mb-4">
    <a class="btn btn-ghost" href="/seller/pawns" hx-boost="true" hx-target="#app-root" hx-push-url="true">← Wróć</a>
    <h1 class="text-2xl font-semibold">Zastaw (sklep)</h1>
    <span class="ml-auto text-xs">ID: <span class="font-mono" x-text="pawn?.public_id || '—'"></span></span>
  </div>

  <!-- Skeleton / błąd -->
  <template x-if="loading"><div class="h-28 rounded-lg elevated-panel animate-pulse"></div></template>
  <template x-if="err"><div class="alert alert-error my-3" x-text="err"></div></template>

  <template x-if="pawn">
    <div class="space-y-6">

      <!-- Podsumowanie -->
      <div class="gold-panel">
        <div class="card-body grid md:grid-cols-3 gap-3">

          <!-- Kolumna A: status + kwoty + daty -->
          <div class="md:col-span-2 space-y-3">
            <div class="flex items-start gap-2 flex-wrap">
              <div class="text-sm opacity-70">Status</div>
              <div class="ml-2 badge"
                   :class="{
                     'badge-success': pawn?.is_active,
                     'badge-info'   : pawn?.status==='REDEEMED',
                     'badge-warning': pawn?.status==='FORFEITED'
                   }"
                   x-text="({ACTIVE:'Aktywny', REDEEMED:'Wykupiony', FORFEITED:'Niewykupiony'}[pawn?.status] || (pawn?.status || '—'))">
              </div>
            </div>

            <div class="grid sm:grid-cols-3 gap-2">
              <div>
                <div class="text-xs opacity-70">Kapitał</div>
                <div class="font-semibold" x-text="app.moneyText(pawn.principal)"></div>
              </div>
              <div>
                <div class="text-xs opacity-70">Wycena</div>
                <div class="font-medium" x-text="app.moneyText(pawn.appraisal_total)"></div>
              </div>
              <div>
                <div class="text-xs opacity-70">Termin</div>
                <div class="font-medium">
                  <span x-text="new Date(pawn.start_date).toLocaleDateString('pl-PL')"></span>
                  <span class="opacity-60">→</span>
                  <span x-text="new Date(pawn.due_date).toLocaleDateString('pl-PL')"></span>
                </div>
              </div>
            </div>
          </div>

          <!-- Kolumna B: akcje sklepu -->
          <div class="space-y-2 md:text-right">
            <div class="text-sm font-medium">Akcje (offline)</div>
            <div class="join md:justify-end">
              <button class="btn btn-sm join-item" :disabled="busy || !active" @click="extendOffline(7)">+7 dni</button>
              <button class="btn btn-sm join-item" :disabled="busy || !active" @click="extendOffline(14)">+14 dni</button>
              <button class="btn btn-sm join-item btn-primary btn-gold" :disabled="busy || !active" @click="extendOffline(30)">+30 dni</button>
            </div>
            <div class="actions md:justify-end">
              <button class="btn btn-sm btn-success" :disabled="busy || !active" @click="redeem()">Wykup</button>
              <button class="btn btn-sm btn-warning" :disabled="busy || !active" @click="forfeit()">Niewykupiony</button>
            </div>

            <div class="mt-2 flex items-center gap-2 md:justify-end">
              <a class="btn btn-sm" href="#" @click.prevent="downloadReceipt('csv')">CSV</a>
              <a class="btn btn-sm btn-outline" href="#" @click.prevent="downloadReceipt('pdf')">PDF</a>
            </div>
          </div>
        </div>
      </div>

      <!-- Przedmioty -->
      <div class="elevated-panel p-5">
        <div class="font-medium mb-2">Przedmioty</div>

        <div class="space-y-2" x-show="pawn.lines?.length">
          <template x-for="ln in pawn.lines" :key="ln.public_id || ln.id">
            <div class="list-row p-3">
              <div class="font-medium truncate" x-text="ln.title || ln.item_snapshot?.set_name || 'Pozycja'"></div>

              <div class="text-sm opacity-80 mt-0.5">
                Ilość: <span x-text="ln.quantity || 1"></span>
                <template x-if="ln.appraisal_value">
                  <span> · Wycena: <b x-text="app.moneyText(ln.appraisal_value)"></b></span>
                </template>
              </div>

              <div class="text-xs opacity-70" x-show="ln.item_snapshot?.type_path">
                Kategoria: <span x-text="ln.item_snapshot.type_path"></span>
              </div>

              <div class="attr-pills mt-2">
                <template x-for="pair in attrPairsFor(ln).slice(0,12)" :key="pair[0] + uiNonce">
                  <span class="attr-pill" :title="pair[0] + ': ' + String(pair[1])">
                    <span class="k" x-text="pair[0] + ':'"></span>
                    <span class="v" x-text="String(pair[1])"></span>
                  </span>
                </template>
                <span class="text-[11px] opacity-60" x-show="attrPairsFor(ln).length === 0">brak atrybutów</span>
              </div>
            </div>
          </template>
        </div>

        <template x-if="!pawn.lines?.length"><div class="text-sm opacity-70">Brak pozycji.</div></template>

        <template x-if="pawn.forfeited_item">
          <div class="alert alert-info mt-3">
            Wystawiono do sprzedaży:
            <a class="link" :href="'/i/'+pawn.forfeited_item.slug" hx-boost="true" hx-target="#app-root" hx-push-url="true"
               x-text="pawn.forfeited_item.set_name"></a>
          </div>
        </template>
      </div>

      <!-- Przedłużenia -->
      <div class="elevated-panel p-5">
        <div class="font-medium mb-2">Historia przedłużeń</div>
        <div class="space-y-2" x-show="pawn.extensions?.length">
          <template x-for="ex in pawn.extensions" :key="ex.public_id">
            <div class="list-row p-3 flex items-center justify-between text-sm">
              <div>
                <div>Dni: <b x-text="ex.days"></b></div>
                <div class="text-xs opacity-70">
                  Termin:
                  <span x-text="new Date(ex.previous_due).toLocaleDateString('pl-PL')"></span>
                  <span class="opacity-60">→</span>
                  <span x-text="new Date(ex.new_due).toLocaleDateString('pl-PL')"></span>
                </div>
              </div>
              <div class="text-right">
                <div class="text-xs opacity-70">Opłata</div>
                <div class="font-medium" x-text="app.moneyText(ex.fee)"></div>
              </div>
            </div>
          </template>
        </div>
        <template x-if="!pawn.extensions?.length"><div class="text-sm opacity-70">Brak.</div></template>
      </div>

      <!-- Klient (stały, z akcjami jak w zamówieniu) -->
      <div class="elevated-panel p-5">
        <div class="panel-head">
          <div class="font-medium">Klient</div>
          <span class="text-xs opacity-70" x-show="!(pawn.customer_public_id || pawn.customer)">
            (snapshot z chwili transakcji)
          </span>
          <span class="ml-auto text-xs" x-show="(pawn.customer_public_id || pawn.customer)">
            Powiązano:
            <span class="font-mono" x-text="pawn.customer_public_id || pawn.customer"></span>
          </span>
        </div>

        <!-- Formularz snapshotu -->
        <div class="grid md:grid-cols-2 gap-2">
          <input class="input input-bordered" placeholder="Imię" x-model="custForm.first_name">
          <input class="input input-bordered" placeholder="Nazwisko" x-model="custForm.last_name">
          <input class="input input-bordered" type="email" placeholder="Email" x-model="custForm.email">
          <input class="input input-bordered" placeholder="Telefon" x-model="custForm.phone">

          <input class="input input-bordered md:col-span-2" placeholder="Adres – linia 1" x-model="custForm.address.line1">
          <input class="input input-bordered md:col-span-2" placeholder="Adres – linia 2" x-model="custForm.address.line2">
          <input class="input input-bordered" placeholder="Kod pocztowy" x-model="custForm.address.postal_code">
          <input class="input input-bordered" placeholder="Miasto" x-model="custForm.address.city">
          <input class="input input-bordered" placeholder="Kraj (ISO-2, np. PL)" x-model="custForm.address.country">

          <input class="input input-bordered" placeholder="Typ dokumentu" x-model="custForm.document_type">
          <input class="input input-bordered" placeholder="Numer dokumentu" x-model="custForm.document_number">
          <div>
            <label class="label"><span class="label-text">Data urodzenia</span></label>
            <input class="input input-bordered w-full" type="date" x-model="custForm.birth_date">
          </div>
        </div>

        <!-- Akcje klienta -->
        <div class="mt-3 flex flex-wrap items-center gap-2">
          <div class="join">
            <input class="input input-bordered input-sm join-item"
                   placeholder="Szukaj klienta (email/telefon/imię nazwisko)"
                   x-model="custSearch.q"
                   @keydown.enter.prevent="searchCustomers()">
            <button class="btn btn-sm join-item" @click="searchCustomers()">Szukaj</button>
          </div>
          <button class="btn btn-sm btn-primary" @click="ensureCustomer()">Połącz / Utwórz klienta</button>
          <button class="btn btn-sm btn-outline" x-show="(pawn.customer_public_id || pawn.customer)" @click="detachCustomer()">Odłącz</button>
          <span class="text-xs opacity-70" x-show="ensureInfo" x-text="ensureInfo"></span>
        </div>

        <!-- Wyniki wyszukiwania -->
        <div class="mt-2 max-h-48 overflow-auto space-y-1" x-show="custSearch.results.length">
          <template x-for="c in custSearch.results" :key="c.public_id">
            <div class="p-2 rounded border flex items-center gap-2">
              <div class="min-w-0">
                <div class="font-medium truncate" x-text="(c.first_name||'')+' '+(c.last_name||'') || '(bez nazwy)'"></div>
                <div class="text-xs opacity-70 truncate" x-text="(c.email||'—') + ' • ' + (c.phone||'—') + ' • ' + (c.city||'')"></div>
              </div>
              <button class="btn btn-xs ml-auto" @click="attachCustomer(c.public_id)">Połącz</button>
            </div>
          </template>
        </div>
      </div>

    </div>
  </template>
</section>
