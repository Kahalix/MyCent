<section class="max-w-4xl mx-auto" data-protected>
  <h1 class="text-2xl font-semibold mb-4">Moje płatności</h1>
  <div x-data="app.payList()" x-init="init()">
    <template x-if="loading"><div class="h-24 rounded-lg border animate-pulse bg-base-300/40"></div></template>
    <template x-if="err"><div class="alert alert-error my-3" x-text="err"></div></template>

    <div class="space-y-3" x-show="!loading && !err">
      <template x-for="p in items" :key="p.public_id">
        <div class="p-4 rounded-lg border flex items-center justify-between">
          <div>
            <div class="text-sm opacity-70">Płatność</div>
            <div class="font-mono text-xs" x-text="p.public_id"></div>
            <div class="text-xs opacity-70 mt-1">
              Tx: <span class="font-mono" x-text="p.transaction_public_id"></span>
            </div>
          </div>
          <div class="text-right">
            <div class="text-sm opacity-70">Status</div>
            <div class="badge" :class="{
              'badge-warning': p.status==='REQUIRES_CONFIRMATION' || p.status==='PROCESSING',
              'badge-success': p.status==='SUCCEEDED',
              'badge-error': p.status==='FAILED',
            }" x-text="p.status"></div>
            <div class="text-sm mt-2" x-text="(p.amount?.amount!=null? Number(p.amount.amount).toFixed(2)+' '+p.amount.currency : '—')"></div>
            <div class="mt-2 flex gap-2 justify-end">
              <a class="btn btn-primary btn-sm btn-gold" x-show="p.status==='REQUIRES_CONFIRMATION'"
                 :href="'/pay/'+p.transaction_public_id" hx-boost="true" hx-target="#app-root" hx-push-url="true">Dokończ</a>
            </div>
          </div>
        </div>
      </template>
    </div>
  </div>
</section>
