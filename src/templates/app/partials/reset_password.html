<section class="max-w-md mx-auto" x-data="app.resetForm()" x-init="init()">
  <h1 class="text-2xl font-semibold mb-4">Ustaw nowe hasło</h1>
  <form class="space-y-2" @submit.prevent="submit" hx-boost="false" novalidate autocomplete="off">
    <input class="input input-bordered w-full" type="password" x-model="new_password" placeholder="Nowe hasło" required>
    <input class="input input-bordered w-full" type="password" x-model="new_password2" placeholder="Powtórz hasło" required>
    <button class="btn btn-primary btn-gold w-full" :disabled="busy" x-text="busy?'Zapisywanie…':'Zapisz'"></button>
    <p class="text-success text-sm" x-text="ok"></p>
    <p class="text-error text-sm" x-text="err"></p>
  </form>
</section>
