<section class="max-w-5xl mx-auto" x-data="app.sellerOrderPawnForm()" x-init="init()" data-protected>
  <div class="mb-4 flex items-center gap-2">
    <a class="btn btn-ghost" href="/seller/orders" hx-boost="true" hx-target="#app-root" hx-push-url="true">← Wróć</a>
    <h1 class="text-xl font-semibold">Skup od klienta</h1>
  </div>

  <div class="card card-bordered bg-base-100">
    <form class="card-body gold-panel grid gap-4"
          hx-boost="false"
          @submit.prevent.stop="save()"
          novalidate>

      <!-- ALERTY -->
      <template x-if="err"><div class="alert alert-error whitespace-pre-line" x-text="err"></div></template>
      <template x-if="ok"><div class="alert alert-success" x-text="ok"></div></template>

      <!-- L I N I E (pozycje skupu) -->
      <div class="p-3 rounded border border-base-300 bg-base-100">
        <div class="flex items-center justify-between">
          <div class="font-medium">Pozycje</div>
          <button type="button" class="btn btn-xs btn-outline" @click="addLine()">+ Dodaj wiersz</button>
        </div>

        <div class="mt-3 space-y-4">
          <template x-for="(row, i) in form.lines" :key="row.uid">
            <div class="p-3 rounded border border-base-300 bg-base-100">
              <!-- Główne pola wiersza (zwarty grid) -->
              <div class="grid md:grid-cols-5 gap-2 items-end">
                <div>
                  <input :id="'pawn_title_'+row.uid"
                         class="input input-bordered fancy-area w-full"
                         :class="row._errs.title ? 'input-error' : ''"
                         placeholder="Tytuł"
                         x-model="row.title" required>
                  <p class="text-xs text-error mt-1" x-show="row._errs.title" x-text="row._errs.title"></p>
                </div>

                <div>
                  <div class="numstep numstep--md">
                    <input :id="'pawn_qty_'+row.uid"
                           class="input input-bordered fancy-area w-full numstep__input"
                           :class="row._errs.quantity ? 'input-error' : ''"
                           type="number" min="1" step="1"
                           placeholder="Ilość"
                           x-model.number="row.quantity" required>
                    <button type="button" class="numstep__btn numstep__btn--up"   aria-label="Zwiększ"></button>
                    <button type="button" class="numstep__btn numstep__btn--down" aria-label="Zmniejsz"></button>
                  </div>
                  <p class="text-xs text-error mt-1" x-show="row._errs.quantity" x-text="row._errs.quantity"></p>
                </div>

                <div class="md:col-span-2">
                  <input :id="'pawn_price_'+row.uid"
                         class="input input-bordered fancy-area w-full"
                         :class="row._errs.unit_price ? 'input-error' : ''"
                         inputmode="decimal"
                         placeholder="Cena skupu (PLN)"
                         x-model="row.unit_price" required>
                  <p class="text-xs text-error mt-1" x-show="row._errs.unit_price" x-text="row._errs.unit_price"></p>
                </div>

                <div>
                  <input type="hidden" class="input input-bordered fancy-area w-full"
                         placeholder="ItemType public_id (opcjonalnie)"
                         x-model="row.item_type_public_id">
                </div>
              </div>

              <!-- WYBORY: katalog/kategoria -->
              <div class="grid md:grid-cols-2 gap-3 mt-3 items-stretch">
                <!-- CatalogItem -->
                <div class="p-3 rounded border border-base-300 bg-base-100 h-full flex flex-col">
                  <div class="flex items-center justify-between">
                    <div class="font-medium">Pozycja z katalogu</div>
                    <button class="btn btn-xs" type="button" x-show="row._selectedCatalog" @click="clearRowCatalog(i)">Usuń katalog</button>
                  </div>

                  <template x-if="!row._selectedCatalog">
                    <button class="btn btn-sm btn-outline mt-2" type="button" @click="openRowCatalogPicker(i)">Wybierz z katalogu</button>
                  </template>

                  <template x-if="row._selectedCatalog">
                    <div class="catalog-summary mt-2">
                      <img :src="app.imgUrl(row._selectedCatalog.image_path || row._selectedCatalog.image_url || '')" alt="">
                      <div class="meta text-sm">
                        <div class="font-medium truncate" x-text="row._selectedCatalog.item_name"></div>
                        <div class="text-xs opacity-70 truncate" x-text="row._selectedCatalog.type?.path || ''"></div>
                      </div>

                      <div class="attr-pills">
                        <template x-for="pair in (_attrPairsForRow(row, row._selectedCatalog.attributes || row.attributes || {}).slice(0,12))" :key="pair[0]">
                          <span class="attr-pill" :title="pair[0] + ': ' + String(pair[1])">
                            <span class="k" x-text="pair[0] + ':'"></span>
                            <span class="v" x-text="String(pair[1])"></span>
                          </span>
                        </template>
                        <span class="text-[11px] opacity-60"
                              x-show="_attrPairsForRow(row, row._selectedCatalog.attributes || row.attributes || {}).length === 0">
                          brak atrybutów
                        </span>
                      </div>
                    </div>
                  </template>

                  <p class="text-xs opacity-70 mt-2">Po wyborze z katalogu - kategoria ustawi się automatycznie.</p>
                </div>

                <!-- Kategoria -->
                <div class="p-3 rounded border border-base-300 bg-base-100 h-full flex flex-col">
                  <div class="flex items-center justify-between">
                    <div class="font-medium">Kategoria</div>
                    <button class="btn btn-xs" type="button" x-show="row._selectedType && !row._selectedCatalog" @click="clearRowCategory(i)">Zmień</button>
                  </div>

                  <template x-if="!row._selectedType && !row._selectedCatalog">
                    <button class="btn btn-sm btn-outline mt-2" type="button" @click="openRowCategoryPicker(i)">Wybierz kategorię</button>
                  </template>

                  <template x-if="row._selectedType">
                    <div class="mt-2 text-sm">
                      <div class="font-medium" x-text="row._selectedType.name"></div>
                      <div class="opacity-70" x-text="row._selectedType.path"></div>
                    </div>
                  </template>

                  <template x-if="row._selectedCatalog">
                    <div class="mt-2 text-xs opacity-70">Kategoria zablokowana — pochodzi z katalogu.</div>
                  </template>
                </div>
              </div>

              <!-- ATRUBUTY -->
              <div class="mt-3">
                <label class="label"><span class="label-text">Atrybuty</span></label>
                <textarea class="hidden" data-ssf="1" :id="'pawn_attrs_ssf_'+row.uid">{}</textarea>
                <p class="text-xs text-error mt-1 whitespace-pre-line" x-show="row._schemaErr" x-text="row._schemaErr"></p>
              </div>

              <div class="mt-3 text-xs flex justify-between">
                <span class="opacity-70" x-text="'Wiersz: '+(i+1)"></span>
                <button type="button" class="btn btn-xs btn-outline" @click="removeLine(i)">Usuń wiersz</button>
              </div>
            </div>
          </template>
        </div>
      </div>

      <!-- KLIENT -->
      <div class="p-3 rounded border border-base-300 bg-base-100">
        <div class="flex items-center gap-2">
          <div class="font-medium">Klient</div>
          <span class="text-xs opacity-70">(wyszukaj po emailu/telefonie lub imieniu+nazwisku)</span>
        </div>

        <div class="mt-2 grid sm:grid-cols-[1fr_auto] gap-2">
          <input class="input input-bordered input-sm fancy-area" placeholder="Szukaj klienta…" x-model="cust.q" @keydown.enter.prevent="cust.search()">
          <button class="btn btn-sm" type="button" @click="cust.search()">Szukaj</button>
        </div>

        <div class="mt-2 max-h-48 overflow-auto space-y-1 cm-soft-scroll" x-show="cust.results.length">
          <template x-for="c in cust.results" :key="c.public_id">
            <button type="button"
                    class="w-full text-left p-2 rounded border border-base-300 bg-base-100 hover:bg-base-200/60"
                    @click="cust.pick(c)">
              <div class="font-medium" x-text="(c.first_name||'')+' '+(c.last_name||'') || '(bez nazwy)'"></div>
              <div class="text-xs opacity-70" x-text="(c.email||'—') + ' • ' + (c.phone||'—') + ' • ' + (c.city||'')"></div>
            </button>
          </template>
          <div class="pt-2 flex justify-center" x-show="cust.next">
            <button type="button" class="btn btn-outline btn-xs" @click="cust.more()">Więcej…</button>
          </div>
        </div>

        <div class="mt-3 grid md:grid-cols-2 gap-2">
          <input class="input input-bordered fancy-area" placeholder="Imię" x-model="customer.first_name">
          <input class="input input-bordered fancy-area" placeholder="Nazwisko" x-model="customer.last_name">
          <input class="input input-bordered fancy-area" type="email" placeholder="Email" x-model="customer.email">
          <input class="input input-bordered fancy-area" placeholder="Telefon" x-model="customer.phone">

          <input class="input input-bordered fancy-area md:col-span-2" placeholder="Adres – linia 1" x-model="customer.address_line1">
          <input class="input input-bordered fancy-area md:col-span-2" placeholder="Adres – linia 2" x-model="customer.address_line2">
          <input class="input input-bordered fancy-area" placeholder="Kod pocztowy" x-model="customer.postal_code">
          <input class="input input-bordered fancy-area" placeholder="Miasto" x-model="customer.city">
          <input class="input input-bordered fancy-area" placeholder="Kraj (ISO-2, np. PL)" x-model="customer.country">

          <input class="input input-bordered fancy-area" placeholder="Typ dokumentu (np. ID, PASSPORT)" x-model="customer.document_type">
          <input class="input input-bordered fancy-area" placeholder="Numer dokumentu" x-model="customer.document_number">
          <div>
            <label class="label"><span class="label-text">Data urodzenia</span></label>
            <input class="input input-bordered fancy-area w-full" type="date" x-model="customer.birth_date">
          </div>
        </div>

        <div class="mt-2 text-xs flex items-center gap-2">
          <span x-show="customer_public_id" class="badge badge-ghost">Powiązano:
            <span class="ml-1 font-mono" x-text="customer_public_id"></span>
          </span>
          <button class="btn btn-xs btn-outline" type="button" x-show="customer_public_id" @click="cust.clearLink()">Odłącz</button>
        </div>
      </div>

      <!-- PARAMETRY SKUPU -->
      <div class="grid md:grid-cols-3 gap-3">
        <div>
          <label class="label"><span class="label-text">Płatność</span></label>
          <select class="select select-bordered fancy-select w-full" x-model="form.payment_method">
            <option value="CASH">Gotówka</option>
            <option value="BANK_TRANSFER">Przelew</option>
            <option value="DEBIT_CARD">Karta debetowa</option>
            <option value="CREDIT_CARD">Karta kredytowa</option>
            <option value="PAYPAL">PayPal</option>
          </select>
        </div>
        <div>
          <label class="label"><span class="label-text">Data skupu</span></label>
          <input class="input input-bordered fancy-area w-full" type="date" x-model="form.purchase_date">
        </div>
        <label class="label cursor-pointer">
          <span class="label-text">Utwórz oferty z pozycji</span>
          <input type="checkbox" class="toggle" x-model="form.create_itemsets">
        </label>
      </div>

      <textarea class="textarea textarea-bordered fancy-area" rows="3" placeholder="Uwagi (opcjonalnie)" x-model="form.note"></textarea>

      <div class="flex items-center gap-2">
        <button class="btn btn-primary btn-gold" type="submit" :disabled="busy" x-text="busy ? 'Zapisywanie…' : 'Zapisz'"></button>
        <a class="btn btn-ghost" href="/seller/orders" hx-boost="true" hx-target="#app-root" hx-push-url="true">Anuluj</a>
        <span class="text-success" x-text="ok"></span>
      </div>
    </form>
  </div>

  {% include 'app/partials/_catalog_pick_modals.html' %}
</section>
