<section class="max-w-4xl mx-auto" data-protected>
  <h1 class="text-2xl font-semibold mb-4">Moje transakcje</h1>
  <div x-data="app.txList()" x-init="init()">
    <template x-if="loading">
      <div class="h-24 rounded-lg border animate-pulse bg-base-300/40"></div>
    </template>

    <template x-if="err">
      <div class="alert alert-error my-3" x-text="err"></div>
    </template>

    <div class="space-y-3" x-show="!loading && !err">
      <template x-if="items.length === 0">
        <div class="text-sm opacity-70">Brak transakcji.</div>
      </template>

      <template x-for="t in items" :key="t.public_id">
        <div class="p-4 rounded-lg border flex items-center justify-between">
          <div>
            <div class="text-sm opacity-70">ID</div>
            <div class="font-mono text-xs" x-text="t.public_id"></div>

            <div class="text-xs opacity-70 mt-1">
              Typ: <span class="font-medium" x-text="labelTxType(t.type)"></span>
            </div>

            <div class="text-xs opacity-70 mt-1">
              Data: <span x-text="formatDate(t.created_at)"></span>
            </div>
          </div>

          <div class="text-right">
            <div class="text-sm opacity-70">Kwota</div>
            <div class="font-semibold" x-text="formattedAmount(t)"></div>

            <div class="text-xs mt-2">
              Status:
              <span class="badge" :class="badgeForTxStatus(t.status)" x-text="labelTxStatus(t.status)"></span>
            </div>

            <div class="mt-2 flex gap-2 justify-end">
              <a class="btn btn-primary btn-sm btn-gold"
                 x-show="t.status==='PENDING'"
                 :href="'/pay/'+t.public_id" hx-boost="true" hx-target="#app-root" hx-push-url="true">
                Opłać
              </a>

              <a class="btn btn-ghost btn-sm"
                 :href="'/transactions/'+t.public_id"
                 hx-boost="true" hx-target="#app-root" hx-push-url="true">
                Szczegóły
              </a>
            </div>
          </div>
        </div>
      </template>
    </div>
  </div>
</section>
