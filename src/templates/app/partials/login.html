<section class="max-w-md mx-auto">
  <h1 class="text-2xl font-semibold mb-4">Logowanie</h1>

  <form x-data="app.loginForm()" @submit.prevent="submit"
        hx-boost="false" novalidate autocomplete="off">

    <label class="form-control w-full mb-2">
      <span class="label"><span class="label-text">E-mail</span></span>
      <input class="input input-bordered w-full"
             type="email" inputmode="email" autocomplete="username"
             x-model="email" placeholder="E-mail">
      <span class="label text-error text-xs" x-text="emailErr"></span>
    </label>

    <label class="form-control w-full mb-3">
      <span class="label"><span class="label-text">Hasło</span></span>
      <input class="input input-bordered w-full"
             type="password" autocomplete="current-password"
             x-model="password" placeholder="Hasło">
      <span class="label text-error text-xs" x-text="pwdErr"></span>
    </label>

    <button class="btn btn-primary btn-gold w-full" type="submit"
            :disabled="busy" x-text="busy ? 'Logowanie…' : 'Zaloguj'"></button>

    <!-- błąd z backendu pod formularzem -->
    <p class="mt-3 text-error text-sm" x-text="formErr"></p>

    <div class="mt-4 text-sm flex justify-between">
      <a class="link" href="/forgot">Zapomniałeś hasła?</a>
      <a class="link" href="/register">Nie masz konta? Zarejestruj</a>
    </div>
  </form>
</section>
