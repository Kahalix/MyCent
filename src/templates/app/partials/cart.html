<section class="max-w-5xl mx-auto cart-page" data-protected>
  <h1 class="text-2xl font-semibold mb-4">Koszyk</h1>

  <!-- Scoped style: ukryj natywne spinnery w input[type=number] w koszyku -->
  <style>
    .cart-page .cart-qty { -moz-appearance: textfield; }
    .cart-page .cart-qty::-webkit-outer-spin-button,
    .cart-page .cart-qty::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  </style>

  <div x-data="app.cartPage()" x-init="init()">
    <template x-if="loading">
      <div class="space-y-2">
        <div class="h-20 rounded-lg border animate-pulse bg-base-300/40"></div>
        <div class="h-20 rounded-lg border animate-pulse bg-base-300/40"></div>
      </div>
    </template>

    <template x-if="err"><div class="alert alert-error my-2 whitespace-pre-line" x-text="err"></div></template>
    <template x-if="ok"><div class="alert alert-success my-2" x-text="ok"></div></template>

    <template x-if="!loading && !items.length && !err">
      <div class="cm-card p-4 text-sm opacity-80">
        Twój koszyk jest pusty.
        <div class="mt-3">
          <a class="btn btn-primary btn-gold btn-sm" href="/offers" hx-boost="true" hx-target="#app-root" hx-push-url="true">Przeglądaj ogłoszenia</a>
        </div>
      </div>
    </template>

    <div class="grid md:grid-cols-3 gap-6" x-show="!loading && items.length">
      <!-- Lista pozycji -->
      <div class="md:col-span-2 space-y-2">
        <template x-for="row in items" :key="row.public_id">
          <div class="list-row p-3 flex items-start gap-3">
            <div class="cm-thumb-80">
              <img :src="img(row)" alt="">
            </div>

            <div class="min-w-0 grow">
              <div class="font-medium truncate" x-text="row.item?.set_name || '(bez nazwy)'"></div>
              <div class="text-sm opacity-70">
                <span x-text="(priceAmount(row).toFixed(2)) + ' ' + currency(row)"></span>
                <span class="mx-1">·</span>
                <span x-text="row.item?.type?.path || '—'"></span>
              </div>

              <div class="mt-2 flex items-center gap-2">
                <button class="btn btn-xs" @click="dec(row)">−</button>
                <input
                  type="number" min="0" step="1"
                  class="input input-bordered input-xs w-16 cart-qty text-center"
                  :value="row.quantity"
                  @change="setQty(row, $event.target.value)"
                >
                <button class="btn btn-xs" @click="inc(row)">+</button>

                <span class="ml-auto text-sm font-medium"
                      x-text="(lineTotal(row).toFixed(2)) + ' ' + currency(row)"></span>
              </div>
            </div>

            <div class="shrink-0 flex flex-col items-end gap-1">
              <a class="btn btn-xs btn-outline"
                 :href="itemUrl(row)"
                 hx-boost="true" hx-target="#app-root" hx-push-url="true">
                Ogłoszenie
              </a>
              <button class="btn btn-xs btn-outline btn-error" @click="remove(row)">Usuń</button>
            </div>
          </div>
        </template>

        <div class="text-right">
          <button class="btn btn-ghost btn-sm" @click="clear()">Wyczyść koszyk</button>
        </div>
      </div>

      <!-- Podsumowanie -->
      <aside class="gold-panel h-max md:sticky md:top-24">
        <div class="card-body p-4 flex flex-col">
          <div class="flex items-center justify-between">
            <h2 class="font-semibold">Podsumowanie</h2>
            <span class="badge badge-ghost" x-text="items.length + ' poz.'"></span>
          </div>

          <div class="mt-2 flex justify-between text-sm">
            <span>Wartość produktów</span>
            <span x-text="total().toFixed(2) + ' PLN'"></span>
          </div>

          <button class="btn btn-primary btn-gold mt-3 ml-auto"
                  :disabled="checkingOut || !items.length"
                  @click="checkout()"
                  x-text="checkingOut ? 'Przetwarzanie…' : 'Zamów'"></button>
        </div>
      </aside>
    </div>
  </div>
</section>
