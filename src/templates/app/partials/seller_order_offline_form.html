<section class="max-w-4xl mx-auto" x-data="app.sellerOrderOfflineForm()" x-init="init()" data-protected>
  <div class="mb-4 flex items-center gap-2">
    <a class="btn btn-ghost" href="/seller/orders" hx-boost="true" hx-target="#app-root" hx-push-url="true">← Wróć</a>
    <h1 class="text-xl font-semibold">Sprzedaż offline</h1>
  </div>

  <div class="card card-bordered bg-base-100">
    <form class="card-body gold-panel grid gap-4"
          hx-boost="false"
          @submit.prevent.stop="save()"
          novalidate>

      <!-- ALERTY -->
      <template x-if="err"><div class="alert alert-error" x-text="err"></div></template>
      <template x-if="ok"><div class="alert alert-success" x-text="ok"></div></template>

      <!-- PRZEDMIOT -->
      <div class="p-3 rounded border">
        <div class="font-medium mb-2">Wybierz przedmiot z Twoich ofert</div>

        <template x-if="!selected">
          <div class="space-y-2">
            <div class="flex items-center gap-2">
              <input class="input input-bordered input-sm fancy-area grow"
                     placeholder="Szukaj w ofertach…"
                     x-model="q"
                     @keydown.enter.prevent="search()">
              <button type="button" class="btn btn-sm" @click="search()">Szukaj</button>
            </div>

            <!-- FILTRY STATUSU -->
            <div class="flex items-center gap-3 flex-wrap text-sm mt-1">
              <span class="opacity-70">Status:</span>

              <label class="label cursor-pointer gap-2 p-0">
                <input type="checkbox" class="checkbox checkbox-xs"
                       x-model="status.available" @change="search()">
                <span>Dostępne</span>
              </label>

              <label class="label cursor-pointer gap-2 p-0">
                <input type="checkbox" class="checkbox checkbox-xs"
                       x-model="status.reserved" @change="search()">
                <span>Zarezerwowane</span>
              </label>

              <button type="button" class="btn btn-ghost btn-xs"
                      @click="selectAllStatuses()">Wszystkie</button>
            </div>

            <p class="text-xs text-error" x-show="fv.selected" x-text="fv.selected"></p>

            <template x-if="loading"><div class="h-20 rounded border animate-pulse bg-base-300/40"></div></template>
            <div class="grid sm:grid-cols-2 gap-2 max-h-[50vh] overflow-auto cm-soft-scroll">
              <template x-for="it in items" :key="it.public_id || it.id">
                <button type="button"
                        class="p-2 rounded border hover:bg-base-200/60 text-left flex items-center gap-3"
                        @click="pick(it)">
                  <img :src="img(it)" class="list-thumb rounded object-cover border" alt="">
                  <div class="min-w-0">
                    <div class="font-medium truncate" x-text="it.set_name || '(bez nazwy)'"></div>
                    <div class="text-xs opacity-70 truncate"
                         x-text="(it.type?.path || '—') + ' • ' + priceText(it)"></div>
                  </div>
                </button>
              </template>
            </div>
            <div class="pt-2 flex justify-center" x-show="next">
              <button type="button" class="btn btn-outline btn-sm" @click="more()">Pokaż więcej</button>
            </div>
          </div>
        </template>

        <template x-if="selected">
          <div class="flex items-center gap-3">
            <img :src="img(selected)" class="list-thumb rounded object-cover border" alt="">
            <div class="min-w-0">
              <div class="font-medium truncate" x-text="selected.set_name || '(bez nazwy)'"></div>
              <div class="text-xs opacity-70" x-text="selected.type?.path || '—'"></div>
              <div class="text-xs opacity-70" x-text="'ID: ' + (selected.public_id || selected.id)"></div>
            </div>
            <button type="button" class="btn btn-xs ml-auto" @click="clear()">Zmień</button>
          </div>
        </template>
      </div>

      <!-- KLIENT — AUTOUZUPEŁNIANIE + DANE -->
      <div class="p-3 rounded border">
        <div class="flex items-center gap-2">
          <div class="font-medium">Klient (opcjonalnie)</div>
          <span class="text-xs opacity-70">(wyszukaj po emailu, telefonie, imieniu/nazwisku)</span>
        </div>

        <!-- wyszukiwarka -->
        <div class="mt-2 grid sm:grid-cols-[1fr_auto] gap-2">
          <input class="input input-bordered input-sm fancy-area"
                 placeholder="Szukaj klienta…"
                 x-model="cust.q"
                 @keydown.enter.prevent="cust.search()">
          <button class="btn btn-sm" type="button" @click="cust.search()">Szukaj</button>
        </div>

        <div class="mt-2 max-h-48 overflow-auto space-y-1 cm-soft-scroll" x-show="cust.results.length">
          <template x-for="c in cust.results" :key="c.public_id">
            <button type="button" class="w-full text-left p-2 rounded border hover:bg-base-200/60"
                    @click="cust.pick(c)">
              <div class="font-medium" x-text="(c.first_name||'')+' '+(c.last_name||'') || '(bez nazwy)'"></div>
              <div class="text-xs opacity-70"
                   x-text="(c.email||'—') + ' • ' + (c.phone||'—') + ' • ' + (c.city||'')"></div>
            </button>
          </template>
          <div class="pt-2 flex justify-center" x-show="cust.next">
            <button type="button" class="btn btn-outline btn-xs" @click="cust.more()">Więcej…</button>
          </div>
        </div>

        <!-- formularz klienta -->
        <div class="mt-3 grid md:grid-cols-2 gap-2">
          <input class="input input-bordered fancy-area" placeholder="Imię" x-model="customer.first_name">
          <input class="input input-bordered fancy-area" placeholder="Nazwisko" x-model="customer.last_name">
          <div>
            <input id="offline_cust_email" class="input input-bordered fancy-area w-full" type="email" placeholder="Email" x-model="customer.email">
            <p class="text-xs text-error mt-1" x-show="fv.customer_email" x-text="fv.customer_email"></p>
          </div>
          <div>
            <input id="offline_cust_phone" class="input input-bordered fancy-area w-full" placeholder="Telefon" x-model="customer.phone">
            <p class="text-xs text-error mt-1" x-show="fv.customer_phone" x-text="fv.customer_phone"></p>
          </div>

          <input class="input input-bordered fancy-area md:col-span-2" placeholder="Adres – linia 1" x-model="customer.address_line1">
          <input class="input input-bordered fancy-area md:col-span-2" placeholder="Adres – linia 2" x-model="customer.address_line2">
          <input class="input input-bordered fancy-area" placeholder="Kod pocztowy" x-model="customer.postal_code">
          <input class="input input-bordered fancy-area" placeholder="Miasto" x-model="customer.city">
          <input class="input input-bordered fancy-area" placeholder="Kraj (ISO-2, np. PL)" x-model="customer.country">
        </div>

        <div class="mt-2 text-xs flex items-center gap-2">
          <span x-show="customer_public_id" class="badge badge-ghost">Powiązano:
            <span class="ml-1 font-mono" x-text="customer_public_id"></span>
          </span>
          <button class="btn btn-xs btn-outline" type="button" x-show="customer_public_id" @click="cust.clearLink()">Odłącz</button>
        </div>
      </div>

      <!-- PARAMETRY SPRZEDAŻY -->
      <div class="grid sm:grid-cols-3 gap-3">
        <div>
          <label class="label"><span class="label-text">Ilość</span></label>
          <div class="numstep numstep--md">
            <input id="offline_qty"
                   class="input input-bordered fancy-area w-full numstep__input"
                   type="number" min="1" step="1"
                   x-model.number="quantity" required>
            <button type="button" class="numstep__btn numstep__btn--up"   aria-label="Zwiększ"></button>
            <button type="button" class="numstep__btn numstep__btn--down" aria-label="Zmniejsz"></button>
          </div>
          <p class="text-xs text-error mt-1" x-show="fv.quantity" x-text="fv.quantity"></p>
        </div>

        <div>
          <label class="label"><span class="label-text">Płatność</span></label>
          <select id="offline_pay" class="select select-bordered fancy-select w-full" x-model="payment_method">
            <option value="CASH">Gotówka</option>
            <option value="BANK_TRANSFER">Przelew</option>
            <option value="DEBIT_CARD">Karta debetowa</option>
            <option value="CREDIT_CARD">Karta kredytowa</option>
            <option value="PAYPAL">PayPal</option>
            <option value="CASH_ON_DELIVERY">Pobranie</option>
          </select>
          <p class="text-xs text-error mt-1" x-show="fv.payment_method" x-text="fv.payment_method"></p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button class="btn btn-primary btn-gold" type="submit" :disabled="busy || !selected" x-text="busy ? 'Zapisywanie…' : 'Zapisz'"></button>
        <a class="btn btn-ghost" href="/seller/orders" hx-boost="true" hx-target="#app-root" hx-push-url="true">Anuluj</a>
        <span class="text-success" x-text="ok"></span>
      </div>
    </form>
  </div>
</section>
