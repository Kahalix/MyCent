services:
  db:
    image: postgres:16
    env_file: .env.docker
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U lown -d lown" ]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  stripe-cli:
    image: stripe/stripe-cli:latest
    env_file: .env.docker
    depends_on:
      web:
        condition: service_started
    command:
      - listen
      - --api-key
      - ${STRIPE_SECRET_KEY}
      - --forward-to
      - web:8000/api/payments/webhooks/stripe/
      - --events
      - payment_intent.succeeded,payment_intent.payment_failed,charge.refunded
    restart: unless-stopped

  web:
    build: .
    command: >
      sh -c "python src/manage.py migrate --noinput &&
             python src/manage.py seed_admin &&
             daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env.docker
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      ENV_FILE: /app/.env.docker
    volumes:
      - ./:/app
  
  caddy:
    image: caddy:2
    ports: [ "443:443","80:80" ]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./src/media:/srv/media:ro
    depends_on: [ web ]

  worker:
    build: .
    command: >
      sh -c '
        until python src/manage.py migrate --check; do
          echo "Waiting for migrations..."; sleep 2;
        done;
        celery -A config worker -l info
      '
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started
    env_file: .env.docker
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      ENV_FILE: /app/.env.docker
    volumes: ["./:/app"]

  beat:
    build: .
    command: >
      sh -c '
        until python src/manage.py migrate --check; do
          echo "Waiting for migrations..."; sleep 2;
        done;
        celery -A config beat -l info -s /tmp/celerybeat-schedule
      '
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started
    env_file: .env.docker
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      ENV_FILE: /app/.env.docker
    volumes: ["./:/app"]

volumes:
  pgdata:
