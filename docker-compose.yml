services:
  db:
    image: postgres:16
    env_file: .env.docker
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lown -d lown"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  stripe-cli:
    image: stripe/stripe-cli:latest
    env_file: .env.docker
    depends_on:
      caddy:
        condition: service_started
    command:
      - listen
      - --forward-to
      - https://caddy/api/payments/webhooks/stripe/
      - --skip-verify
      - --events
      - payment_intent.succeeded,payment_intent.payment_failed,payment_intent.canceled,payment_intent.processing,payment_intent.requires_action
    restart: unless-stopped

  web-http:
    build: .
    command: >
      sh -c "python src/manage.py migrate --noinput &&
             python src/manage.py collectstatic --noinput &&
             python src/manage.py seed_admin &&
             gunicorn config.asgi:application -k uvicorn.workers.UvicornWorker -b 0.0.0.0:8000 --workers $${WEB_CONCURRENCY:-4}"
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env.docker
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      ENV_FILE: /app/.env.docker
    volumes:
      - ./:/app

  web-ws:
    build: .
    command: >
      sh -c '
        until python src/manage.py migrate --check; do
          echo "Waiting for migrations..."; sleep 2;
        done;
        daphne -b 0.0.0.0 -p 8001 --ping-interval 20 --ping-timeout 30 config.asgi:application
      '
    expose:
      - "8001"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web-http:
        condition: service_started
    env_file: .env.docker
    volumes:
      - ./:/app

  caddy:
    image: caddy:2
    ports: ["443:443","80:80"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./src/media:/srv/media:ro
    depends_on:
      - web-http
      - web-ws

  worker:
    build: .
    command: >
      sh -c '
        until python src/manage.py migrate --check; do
          echo "Waiting for migrations..."; sleep 2;
        done;
        celery -A config worker -l info
      '
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web-http:
        condition: service_started
    env_file: .env.docker
    volumes: ["./:/app"]

  beat:
    build: .
    command: >
      sh -c '
        until python src/manage.py migrate --check; do
          echo "Waiting for migrations..."; sleep 2;
        done;
        celery -A config beat -l info -s /tmp/celerybeat-schedule
      '
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web-http:
        condition: service_started
    env_file: .env.docker
    volumes: ["./:/app"]

volumes:
  pgdata:
